<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="gradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Geometric Floorplan Glyphs / Icon -->
  <g transform="translate(15, 15)">
    <!-- Outer isometric architectural boundary -->
    <rect x="5" y="5" width="60" height="60" rx="8" fill="none" stroke="url(#gradAccent)" stroke-width="4" />
    <!-- Interior partitions -->
    <line x1="5" y1="35" x2="45" y2="35" stroke="#00d2ff" stroke-width="3" stroke-linecap="round" />
    <line x1="45" y1="5" x2="45" y2="45" stroke="#00d2ff" stroke-width="3" stroke-linecap="round" />
    <line x1="25" y1="35" x2="25" y2="65" stroke="#7928ca" stroke-width="3" stroke-linecap="round" />
    <!-- Core room node with glow -->
    <circle cx="25" cy="20" r="4.5" fill="#00d2ff" filter="url(#glow)" />
    <circle cx="50" cy="50" r="4" fill="#7928ca" />
  </g>

  <!-- Typography -->
  <text x="100" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="4" fill="#ffffff">
    SPAZE
  </text>
  <text x="102" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" letter-spacing="2" fill="#8892b0">
    IMAGINE. GENERATE. INHABIT.
  </text>
</svg>
